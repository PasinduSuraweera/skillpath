[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillpath"
version = "0.1.0"
description = "SkillPath: AI-aware developer career path recommender (IT3051 FDM, KND_12)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "pyarrow>=15",
  "joblib>=1.3",
]

[project.optional-dependencies]
notebooks = ["matplotlib>=3.8", "seaborn>=0.13", "scipy>=1.11", "jupyter", "jupytext", "nbconvert"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillpath = ["resources/*.csv"]
